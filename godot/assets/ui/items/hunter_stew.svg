  <path d="M65 46 Q71 42 74 46 Q69 50 65 46 Z" fill="#68a347" stroke="#2d4a1e" stroke-width="1.5"/>
  <path d="M26 47 Q31 44 33 48 Q29 51 26 47 Z" fill="#68a347" stroke="#2d4a1e" stroke-width="1.5"/>

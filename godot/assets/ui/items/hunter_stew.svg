  <!-- 1. Mini Roasted Chicken piece (left-center) -->
  <path d="M22 39 L16 33" stroke="#f5ebd6" stroke-width="4" stroke-linecap="round"/>
  <circle cx="14" cy="31" r="2.8" fill="#f5ebd6" stroke="#5e4934" stroke-width="1.5"/>
  <circle cx="17" cy="29" r="2.8" fill="#f5ebd6" stroke="#5e4934" stroke-width="1.5"/>
  <path d="M21 43 Q22 32 33 33 Q42 34 41 43 Q35 48 21 43 Z" fill="#b84d14" stroke="#4f2006" stroke-width="2.2"/>
  <path d="M25 38 Q31 34 37 37" fill="none" stroke="#f7b85c" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 2. Glowing Mushroom slice (center-back) -->
  <path d="M46 42 L46 34 Q49 33 52 34 L52 42" fill="#edddae" stroke="#6f4333" stroke-width="2"/>
  <path d="M39 35 Q49 23 59 35 Z" fill="#c17848" stroke="#6f4333" stroke-width="2.2"/>
  <circle cx="47" cy="31" r="1.8" fill="#fff1c4"/>
  <circle cx="52" cy="32" r="1.4" fill="#fff1c4"/>
  <!-- 3. Wild Berries (Blueberry, Raspberry, Golden Berry) -->
  <circle cx="62" cy="42" r="5.5" fill="#385499" stroke="#1c2b52" stroke-width="2"/>
  <circle cx="60.5" cy="40.5" r="1.6" fill="#99b6ff"/>
  <circle cx="52" cy="46" r="5.2" fill="#d93c5e" stroke="#630f1e" stroke-width="2"/>
  <circle cx="50.5" cy="44.5" r="1.6" fill="#ffaec0"/>
  <circle cx="37" cy="47" r="5" fill="#f5b62b" stroke="#6e4606" stroke-width="2"/>
  <circle cx="35.5" cy="45.5" r="1.6" fill="#ffffff"/>
